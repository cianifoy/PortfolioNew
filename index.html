    <script>
      (() => {
        const roles = [
          "UX/UI Designer",
          "Photographer",
          "Tea Lover",
          "Visual Designer",
        ];
        const el = document.getElementById("hero-role");
        if (!el) return;

        let roleIndex = 0;
        let charIndex = roles[0].length;
        let deleting = false;

        const tick = () => {
          const current = roles[roleIndex];

          if (!deleting && charIndex === current.length) {
            setTimeout(() => {
              deleting = true;
              tick();
            }, 3000);
            return;
          }

          if (deleting && charIndex === 0) {
            deleting = false;
            roleIndex = (roleIndex + 1) % roles.length;
          }

          charIndex += deleting ? -1 : 1;
          el.textContent = roles[roleIndex].slice(0, charIndex);
          setTimeout(tick, deleting ? 130 : 220);
        };

        setTimeout(tick, 1800);
      })();
    </script>
